<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoiyook 的博客</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --accent: #00ff9d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            padding: 3rem 1rem;
            max-width: 680px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            margin-bottom: 1.2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }
        .tagline {
            color: #888;
            font-size: 1.05rem;
        }
        nav {
            text-align: center;
            margin: 2.5rem 0;
            border-bottom: 1px solid #222;
            padding-bottom: 1.5rem;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            margin: 0 1.2rem;
            font-weight: 500;
        }
        nav a:hover { color: var(--accent); }
        .post {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #222;
        }
        .post:last-child { border-bottom: none; padding-bottom: 0; }
        .post h2 {
            font-size: 1.55rem;
            margin-bottom: 0.6rem;
            color: var(--accent);
        }
        .date {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 5rem;
            color: #555;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <header>
        <img src="Pic/astronaut-cat.jpg" alt="Hoiyook" class="avatar">
        <h1>Hoiyook</h1>
        <p class="tagline">极简 · 专注 · 记录</p>
    </header>

    <nav>
        <a href="#">首页</a>
        <a href="#">归档</a>
        <a href="#">关于我</a>
    </nav>

    <main>
        <article class="post">
            <h2>欢迎来到我的极简博客</h2>
            <div class="date">2026.06.06</div>
            <p>少即是多。这里没有多余的装饰，只有纯粹的内容。</p>
        </article>

        <article class="post">
            <h2>极简主义的生活方式</h2>
            <div class="date">2026.06.05</div>
            <p>专注于真正重要的事物，摒弃干扰。</p>
        </article>
    </main>

    <footer>
        <p>© 2026 Hoiyook • <a href="https://github.com/Hoiyook" style="color:#777;">GitHub</a></p>
    </footer>
</body>
</html>
